services:
  postgres:
    image: postgres:16-alpine
    container_name: itmanagement_db
    environment:
      POSTGRES_DB: itmanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/ITManagement.API/Dockerfile
    container_name: itmanagement_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=itmanagement;Username=postgres;Password=postgres
      - Jwt__Secret=${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION_AT_LEAST_32_CHARS}
      - Jwt__Issuer=ITManagement
      - Jwt__Audience=ITManagement
      - FileStorage__RootPath=/app/storage
      - Cors__Origins__0=http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - file_storage:/app/storage

  web:
    build:
      context: ../frontend/admin
    depends_on:
      - api
    ports:
      - "8088:80"

volumes:
  postgres_data:
  file_storage:
